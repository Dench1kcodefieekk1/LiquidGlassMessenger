name: LiquidMessenger

options:
  bundleIdPrefix: com.liquidmessenger
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptySchemes: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en

targets:
  LiquidMessenger:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LiquidMessenger
    info:
      path: LiquidMessenger/Support/Info.plist
      properties:
        CFBundleDisplayName: LiquidMessenger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidmessenger.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
    scheme:
      name: LiquidMessenger
